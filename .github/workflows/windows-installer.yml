name: Windows Installer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply customization patch
        shell: pwsh
        run: |
          $patchBase64 = @'
          
          '@
          [IO.File]::WriteAllBytes('codex.patch', [Convert]::FromBase64String($patchBase64.Trim()))
          git apply --3way codex.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-installer

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm check-types

      - name: Test frontend
        run: pnpm test

      - name: Lint frontend
        run: pnpm lint

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build NSIS installer
        run: pnpm exec tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: terax-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
