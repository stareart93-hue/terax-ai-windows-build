name: Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-installer

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm check-types

      - name: Test frontend
        run: pnpm test

      - name: Lint frontend
        run: pnpm lint

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Write CI Tauri config
        shell: pwsh
        run: |
          @'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          '@ | Set-Content -Encoding UTF8 src-tauri/tauri.ci.conf.json

      - name: Build NSIS installer
        run: pnpm exec tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: terax-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
